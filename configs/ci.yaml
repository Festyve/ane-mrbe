# Small, fast configuration for CI / dry-run sanity checks.
# Same shape as default.yaml, scaled down; uses its own paths so it never
# clobbers (or accidentally loads) the full default-config stimuli/results.

model:
  backend: dummy
  model_id: Qwen/Qwen3.6-27B
  lens_repo: anthropics/jacobian-lens
  layer_band: null
  alpha: null
  dtype: bfloat16
  dummy_mode: binding

stimuli:
  items_per_cell: 2
  concept_pairs:
    - [doctor, nurse]
    - [teacher, student]
    - [driver, passenger]
  non_participant_concept: tuesday

experiment:
  edit_types: [real, no_edit, null_non_participant, random_direction]
  injection_sites: [final_token, entity_token]
  seed: 0

analysis:
  n_bootstrap: 500
  n_permutation: 500
  alpha_level: 0.05
  ci_level: 0.95

paths:
  stimuli: data/stimuli/stimuli_ci.jsonl
  results: data/results_ci
  figures: figures_ci
