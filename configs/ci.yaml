# Small, fast configuration for CI / dry-run sanity checks.
# Same shape as default.yaml, scaled down; uses its own paths so it never
# clobbers (or accidentally loads) the full default-config stimuli/results.

model:
  backend: dummy
  model_id: Qwen/Qwen3.6-27B
  lens_repo: anthropics/jacobian-lens  # per-layer averaged Jacobians J_l
  layer_band: null
  alpha: null
  push_coefficient: null
  jspace_k: 16
  ablate_k: 10
  dtype: bfloat16
  load_in_4bit: false
  dummy_mode: binding

stimuli:
  items_per_cell: 2
  concept_pairs:
    - [doctor, nurse]
    - [teacher, student]
    - [driver, passenger]
  non_participant_entities: [chef, farmer, coach]

directions:
  exemplars_per_role: 6
  n_bootstrap: 50
  stability_threshold: 0.8
  variant: fitted
  seed: 0

experiment:
  edit_types: [role_push, no_edit, null_non_participant, random_direction, shuffled_label_direction, identity_swap]
  push_signs: [toward_agent, toward_patient]
  injection_sites: [final_token, entity_token]
  seed: 0

analysis:
  n_bootstrap: 500
  n_permutation: 500
  alpha_level: 0.05
  ci_level: 0.95

paths:
  stimuli: data/stimuli/stimuli_ci.jsonl
  fitting_corpus: data/stimuli/fitting_corpus_ci.jsonl
  directions: data/directions_ci
  calibration: data/calibration_ci.json
  results: data/results_ci
  figures: figures_ci
