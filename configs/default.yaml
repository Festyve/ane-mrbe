# Default experiment configuration.
# Null fields are open Methods decisions — leave null until the team pins
# them (layer band) or calibration produces them (alpha, push_coefficient);
# code that needs them fails loudly rather than guessing.

model:
  # dummy | qwen_jlens. Now the REAL backend: this config describes the run we
  # intend, not a rehearsal of it. Every script still takes --dry-run, which
  # forces DummyModel regardless of this field, so GPU-free work is unaffected
  # — but it now has to be asked for explicitly.
  backend: qwen_jlens
  model_id: Qwen/Qwen3.6-27B  # verified on HF: 64 layers, d_model 5120
  lens_repo: neuronpedia/jacobian-lens  # per-layer averaged Jacobians J_l
  # Scopes the download + file search to this model's lens. The repo carries a
  # lens per model and totals ~57 GB; without this the loader would fetch all
  # of them (and could pick another model's Jacobians).
  lens_subpath: qwen3.6-27b/jlens/Salesforce-wikitext
  # Matches the source paper's SINGLE-LAYER swap analyses, which sit mid-
  # workspace (~L75 of their reindexed 100). Converted for this model's 64
  # layers: round(75/100 * 64) = 48.
  #
  # Their workspace band is reindexed L38-92 -> raw 24-59 here. Run those two
  # edges as separate single-layer robustness runs rather than as one band:
  #     layer_band: [24, 24]   # band start
  #     layer_band: [48, 48]   # primary (this one)
  #     layer_band: [59, 59]   # band end
  # A single [24, 59] band edits all 36 layers at once — ~36x the per-trial
  # edit cost, and it cannot localise the effect, since one smeared edit
  # cannot distinguish "binding lives at L48" from "binding is everywhere".
  #
  # Released lens covers raw layers 0-62, so all three are loadable.
  layer_band: [48, 48]
  alpha: null               # IDENTITY_SWAP scaling; from scripts/calibrate.py (null = pure swap)
  push_coefficient: 8.0    # ROLE_PUSH scaling; from scripts/calibrate.py (fitting corpus only)
  jspace_k: 16              # sparsity of the J-space pursuit (paper: k=16, occupancy ~25)
  ablate_k: 10              # atoms zeroed by ABLATE_JSPACE (paper 3.5.2: k=10)
  dtype: bfloat16
  load_in_4bit: false       # Kaggle 2x T4 path (needs bitsandbytes)
  dummy_mode: binding       # binding | bag — ground truth used by the dummy backend

stimuli:
  items_per_cell: 50        # placeholder pending power calculation
  concept_pairs:            # [entity, identity-swap counterpart (control only)]
    - [doctor, nurse]
    - [teacher, student]
    - [driver, passenger]
  non_participant_entities: [chef, farmer, coach]  # absent-entity pool for the null push

directions:
  exemplars_per_role: 24    # per entity per role; multiple of 6; OPEN pending stability pilot
  n_bootstrap: 200          # bootstrap resamples for the stability check
  stability_threshold: 0.8  # warn below this mean cosine
  variant: fitted           # fitted | generic_loo (leave-one-entity-out robustness variant)
  seed: 0

experiment:
  edit_types: [role_push, no_edit, null_non_participant, random_direction, shuffled_label_direction, identity_swap]
  push_signs: [toward_agent, toward_patient]
  injection_sites: [final_token, entity_token]
  seed: 0

analysis:
  n_bootstrap: 10000
  n_permutation: 10000
  alpha_level: 0.05
  ci_level: 0.95

paths:
  stimuli: data/stimuli/stimuli.jsonl
  fitting_corpus: data/stimuli/fitting_corpus.jsonl
  directions: data/directions
  calibration: data/calibration.json
  results: data/results
  figures: figures
